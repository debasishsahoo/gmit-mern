<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Browser JavaScript</title>
</head>
<body>
    <h1 id="heading">Hello World</h1>

    <script>
        const heading = document.getElementById("heading");
        heading.textContent= "Hello from JavaScript";
        console.log("This message appears in the browser console");
    </script>
</body>
</html>
